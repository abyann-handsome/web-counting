<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yann Project</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Dynamic Island Header -->
  <div class="dynamic-island" id="dynamicIsland">
    <div class="island-camera"></div>
    <div class="island-text" id="islandStatus">Yann Project • Siap 👍</div>
  </div>

  <!-- Kartu Utama Liquid Glass -->
  <div class="ios-card" id="cardContainer">
    <div class="glass-reflection"></div>
    
    <h2>Aplikasi Penghitung</h2>

    <!-- Input Target & Step Options -->
    <div class="setting-bar">
      <div class="setting-item">
        <label for="stepSelect">Kelipatan:</label>
        <select id="stepSelect" class="ios-select">
          <option value="1">1</option>
          <option value="5">5</option>
          <option value="10">10</option>
        </select>
      </div>

      <div class="setting-item">
        <label for="targetInput">Target:</label>
        <input type="number" id="targetInput" placeholder="Misal: 10" class="ios-input">
      </div>
    </div>

    <!-- Tampilan Angka Utama -->
    <div class="tampilan-container">
      <div id="angka" class="tampilan-angka netral">0</div>
      <div id="targetProgress" class="target-progress">Target: Belum diatur</div>
    </div>

    <!-- Tombol-tombol Utama -->
    <div class="tombol-grid">
      <button id="kurang" class="btn btn-kurang" aria-label="Kurangi">
        <span>−</span>
      </button>
      <button id="reset" class="btn btn-reset">
        <span>Reset</span>
      </button>
      <button id="tambah" class="btn btn-tambah" aria-label="Tambah">
        <span>+</span>
      </button>
    </div>

    <!-- Section Riwayat Aktivitas (History Log) -->
    <div class="history-section">
      <div class="history-title">Riwayat Aktivitas</div>
      <ul id="historyList" class="history-list">
        <li class="empty-history">Belum ada riwayat</li>
      </ul>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast">Angka berhasil di-reset ke 0</div>

  <script src="script.js"></script>
</body>
</html>
